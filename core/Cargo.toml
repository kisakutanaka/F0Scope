[package]
name = "pitch_core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustfft = "=6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.129"

[profile.release]
opt-level = 3

[dev-dependencies]
wasm-bindgen-test = "0.3.79"
